<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat</title>
<style>
  :root {
    --bg: #f2f4f7;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #7a8394;
    --accent: #2f6fed;
    --mine: #2f6fed;
    --mine-text: #ffffff;
    --other: #ffffff;
    --border: #e3e7ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141a;
      --card: #1a1f29;
      --text: #e8ebf1;
      --muted: #8c95a6;
      --accent: #4a86ff;
      --mine: #3a76f0;
      --mine-text: #ffffff;
      --other: #1f2531;
      --border: #2a3140;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header .who { font-size: 13px; color: var(--muted); }
  header button.link {
    background: none; border: none; color: var(--accent);
    font-size: 13px; cursor: pointer;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 16px;
    background: var(--other);
    border: 1px solid var(--border);
    align-self: flex-start;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.mine {
    align-self: flex-end;
    background: var(--mine);
    color: var(--mine-text);
    border-color: transparent;
  }
  .msg .name { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
  .msg.mine .name { display: none; }
  .msg .text { font-size: 15px; line-height: 1.35; white-space: pre-wrap; }
  .msg .time { font-size: 11px; opacity: .6; margin-top: 3px; text-align: right; }
  .empty { margin: auto; color: var(--muted); font-size: 14px; text-align: center; padding: 20px; }
  form {
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
  }
  form input {
    flex: 1;
    padding: 11px 14px;
    border-radius: 22px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  form input:focus { border-color: var(--accent); }
  form button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 22px;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  form button:disabled { opacity: .5; }
  #login {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    z-index: 10;
  }
  #login .box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 360px;
    display: flex; flex-direction: column; gap: 14px;
  }
  #login h2 { font-size: 20px; }
  #login p { font-size: 14px; color: var(--muted); }
  #login input {
    padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg); color: var(--text);
    font-size: 16px; outline: none;
  }
  #login button {
    padding: 12px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff;
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .hidden { display: none !important; }
  #error {
    background: #fdecea; color: #b3261e;
    font-size: 13px; padding: 8px 12px; text-align: center;
  }
</style>
</head>
<body>

<div id="login">
  <form class="box" id="loginForm" style="border-top:1px solid var(--border)">
    <h2>Chatga xush kelibsiz</h2>
    <p>Boshqalar sizni qanday ko'rsin? Ismingizni yozing.</p>
    <input id="nameInput" type="text" maxlength="20" placeholder="Ismingiz" autocomplete="off" required>
    <button type="submit">Kirish</button>
  </form>
</div>

<header>
  <h1>Umumiy chat</h1>
  <div>
    <span class="who" id="who"></span>
    <button class="link" id="changeName" type="button">o'zgartirish</button>
  </div>
</header>

<div id="error" class="hidden"></div>
<div id="messages"><div class="empty">Yuklanmoqda...</div></div>

<form id="sendForm">
  <input id="msgInput" type="text" maxlength="500" placeholder="Xabar yozing..." autocomplete="off">
  <button id="sendBtn" type="submit">Yuborish</button>
</form>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getFirestore, collection, addDoc, query, orderBy, limit,
    onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8t9bUZemLJmcHxzWWZD4zxbjq7SI2n3Q",
    authDomain: "chat-sayt-8e578.firebaseapp.com",
    projectId: "chat-sayt-8e578",
    storageBucket: "chat-sayt-8e578.firebasestorage.app",
    messagingSenderId: "352926904813",
    appId: "1:352926904813:web:3d7b06af0cdcd4279d37e4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const $ = (id) => document.getElementById(id);
  const loginEl = $("login");
  const messagesEl = $("messages");
  const errorEl = $("error");

  let myName = "";
  try { myName = localStorage.getItem("chatName") || ""; } catch (e) {}

  function showError(text) {
    errorEl.textContent = text;
    errorEl.classList.remove("hidden");
  }

  function setName(name) {
    myName = name.trim().slice(0, 20);
    try { localStorage.setItem("chatName", myName); } catch (e) {}
    $("who").textContent = myName;
    loginEl.classList.add("hidden");
    render(lastDocs);
    $("msgInput").focus();
  }

  if (myName) {
    $("who").textContent = myName;
    loginEl.classList.add("hidden");
  }

  $("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = $("nameInput").value.trim();
    if (v) setName(v);
  });

  $("changeName").addEventListener("click", () => {
    $("nameInput").value = myName;
    loginEl.classList.remove("hidden");
    $("nameInput").focus();
  });

  function fmtTime(ts) {
    if (!ts || !ts.toDate) return "";
    const d = ts.toDate();
    return d.toLocaleTimeString("uz-UZ", { hour: "2-digit", minute: "2-digit" });
  }

  let lastDocs = [];

  function render(docs) {
    lastDocs = docs;
    const nearBottom =
      messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;

    messagesEl.textContent = "";
    if (!docs.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Hozircha xabar yo'q. Birinchi bo'lib yozing!";
      messagesEl.appendChild(empty);
      return;
    }
    docs.forEach((m) => {
      const wrap = document.createElement("div");
      wrap.className = "msg" + (m.name === myName ? " mine" : "");

      const n = document.createElement("div");
      n.className = "name";
      n.textContent = m.name;

      const t = document.createElement("div");
      t.className = "text";
      t.textContent = m.text;

      const tm = document.createElement("div");
      tm.className = "time";
      tm.textContent = fmtTime(m.createdAt);

      wrap.append(n, t, tm);
      messagesEl.appendChild(wrap);
    });
    if (nearBottom || docs.length <= 1) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  const q = query(collection(db, "messages"), orderBy("createdAt", "asc"), limit(200));
  onSnapshot(
    q,
    (snap) => {
      errorEl.classList.add("hidden");
      const docs = snap.docs.map((d) => d.data());
      render(docs);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    },
    (err) => {
      console.error(err);
      messagesEl.textContent = "";
      showError("Xabarlarni yuklab bo'lmadi. Firestore bazasi yaratilganini va qoidalar (rules) ruxsat berayotganini tekshiring.");
    }
  );

  $("sendForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = $("msgInput");
    const text = input.value.trim();
    if (!text || !myName) return;
    $("sendBtn").disabled = true;
    try {
      await addDoc(collection(db, "messages"), {
        name: myName,
        text: text.slice(0, 500),
        createdAt: serverTimestamp()
      });
      input.value = "";
    } catch (err) {
      console.error(err);
      showError("Xabar yuborilmadi. Internetni va Firestore qoidalarini tekshiring.");
    } finally {
      $("sendBtn").disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
